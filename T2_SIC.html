<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>T2 SIC</title>
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1216;
    --panel:#171c22;
    --panel-2:#1f262d;
    --border:#2a323a;
    --amber:#f2a900;
    --rojo:#e5484d;
    --verde:#33d689;
    --azul:#4aa8ff;
    --text:#eef1f3;
    --text-soft:#8d99a3;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  input,select,textarea,button{font-family:inherit;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:0.5px;}
  .num{font-family:'Roboto Mono',monospace;}

  /* ---------- LOGIN ---------- */
  #vista-login{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 20px;
    background:radial-gradient(ellipse at 50% -10%, rgba(242,169,0,0.10), transparent 55%), var(--bg);
  }
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .login-strip{height:5px;background:linear-gradient(90deg,var(--rojo) 0 33%, var(--amber) 33% 66%, var(--verde) 66% 100%);}
  .login-body{padding:30px 26px 24px;}
  .login-brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .login-brand .t2{font-size:40px;line-height:1;color:var(--amber);}
  .login-brand .sic{font-size:40px;line-height:1;color:var(--text);}
  .login-sub{color:var(--text-soft);font-size:13px;margin:2px 0 26px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:6px;}
  .campo input, .campo select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:13px 14px;font-size:15px;outline:none;transition:border-color .15s;
    appearance:none;-webkit-appearance:none;
  }
  .campo select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238d99a3' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:38px;
  }
  .campo input:focus,.campo select:focus{border-color:var(--amber);}
  .campo-pass-wrap{position:relative;}
  #btn-login{
    width:100%;margin-top:6px;background:var(--amber);color:#1a1300;border:none;border-radius:8px;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s, transform .05s;
  }
  #btn-login:active{transform:scale(0.98);}
  #btn-login:hover{background:#ffb90f;}
  .login-error{color:var(--rojo);font-size:13px;margin-top:12px;min-height:16px;text-align:center;}
  .login-footer{text-align:center;color:var(--text-soft);font-size:11.5px;padding:16px 10px 20px;border-top:1px solid var(--border);letter-spacing:.2px;}

  /* ---------- APP SHELL ---------- */
  #vista-app{display:none;min-height:100vh;min-height:100dvh;padding-bottom:40px;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(15,18,22,0.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar .brand{font-size:22px;}
  .topbar .brand .t2{color:var(--amber);}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-soft);width:34px;height:34px;
    border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  }
  .icon-btn:active{background:var(--panel);}
  main{padding:14px 14px 0;max-width:640px;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .panel.compact{padding:12px;}
  .panel-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.3px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
  .panel-title.small{font-size:15px;margin-bottom:8px;}
  .panel-title .tag{font-size:10.5px;color:var(--text-soft);font-family:'Inter',sans-serif;font-weight:600;background:var(--panel-2);border:1px solid var(--border);padding:3px 8px;border-radius:20px;}

  /* Header AB InBev */
  .marca-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .marca-ab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--text-soft);letter-spacing:.3px;}
  .marca-sic{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;color:var(--text);letter-spacing:.3px;text-align:right;}
  .marca-sic .accent{color:var(--amber);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .campo-mini label{display:block;font-size:11px;color:var(--text-soft);margin-bottom:5px;}
  .campo-mini input,.campo-mini textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;
    padding:9px 10px;font-size:13.5px;outline:none;
  }
  .campo-mini input:focus,.campo-mini textarea:focus{border-color:var(--amber);}
  .campo-mini.full{grid-column:1 / -1;}

  /* Transportes programados + estatus */
  .fila-transp{display:flex;gap:10px;margin-top:14px;}
  .caja-transp{
    flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;
    padding:12px 10px;text-align:center;
  }
  .caja-transp label{display:block;font-size:10px;color:var(--text-soft);letter-spacing:.4px;margin-bottom:6px;}
  .caja-transp input{
    width:100%;background:transparent;border:none;color:var(--amber);text-align:center;
    font-family:'Roboto Mono',monospace;font-weight:700;font-size:26px;outline:none;
    cursor:default;
  }
  .caja-transp label span{display:block;font-size:9px;color:var(--text-soft);letter-spacing:.2px;margin-top:2px;font-weight:400;}
  .caja-estatus{
    flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;
    padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;
  }
  .caja-estatus:active{background:var(--panel);}
  .led{width:16px;height:16px;border-radius:50%;background:var(--azul);box-shadow:0 0 12px 3px rgba(74,168,255,0.7);}
  .caja-estatus span{font-size:10px;color:var(--text-soft);letter-spacing:.4px;text-align:center;}

  /* Estatus de carga - mensaje */
  #panel-mensaje{display:none;}
  #panel-mensaje.open{display:block;}
  .mensaje-caja{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;
    font-family:'Roboto Mono',monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;color:var(--text);
    margin-bottom:10px;
  }
  .btn-row{display:flex;gap:10px;margin-top:4px;}
  .btn-row .btn{width:auto;flex:1;}

  .chart-wrap{position:relative;height:250px;}
  .estado-fila{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .dot{width:10px;height:10px;border-radius:50%;}
  .estado-txt{font-size:12.5px;color:var(--text-soft);}
  .estado-pct{margin-left:auto;font-size:22px;}

  /* Selector de horas */
  .horas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .hora-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-soft);
    border-radius:8px;padding:10px 4px;text-align:center;font-family:'Roboto Mono',monospace;font-size:12.5px;
    font-weight:600;cursor:pointer;
  }
  .hora-btn.activa{background:rgba(242,169,0,0.14);border-color:var(--amber);color:var(--amber);}
  .hora-btn .chk{display:block;font-size:9px;color:var(--verde);margin-top:2px;letter-spacing:.3px;}
  .hora-btn.activa .chk{color:var(--amber);}

  .campo-dato{margin-bottom:10px;}
  .campo-dato label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:6px;}
  .campo-dato input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:12px 14px;font-size:16px;outline:none;font-family:'Roboto Mono',monospace;font-weight:600;
  }
  .campo-dato input:focus{border-color:var(--amber);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;width:100%;
  }
  .btn:active{background:var(--panel);}
  .btn-amber{background:var(--amber);color:#1a1300;border:none;}
  .btn-amber:active{background:#d99400;}
  .btn-ghost{background:transparent;}

  /* Planes de reaccion (compacto) */
  .plan-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
  .plan-num{
    font-family:'Roboto Mono',monospace;color:var(--amber);background:var(--panel-2);border:1px solid var(--border);
    width:22px;height:22px;flex:none;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:11px;margin-top:1px;
  }
  .plan-row input{
    flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:6px 8px;font-size:12px;outline:none;
  }
  .plan-row input:focus{border-color:var(--amber);}

  .collapsible-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .chev{color:var(--text-soft);transition:transform .2s;font-size:13px;}
  .chev.open{transform:rotate(180deg);}
  .collapsible-body{display:none;margin-top:12px;}
  .collapsible-body.open{display:block;}

  .hist-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .hist-item:last-child{border-bottom:none;}
  .hist-fecha{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--text);width:96px;flex:none;line-height:1.4;}
  .hist-info{flex:1;font-size:11.5px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-pct{font-family:'Roboto Mono',monospace;font-weight:700;font-size:14px;}
  .hist-empty{color:var(--text-soft);font-size:13px;text-align:center;padding:14px 0;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:30px;
    font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer.app-footer{text-align:center;color:var(--text-soft);font-size:11px;padding:18px 10px 6px;}

  @media (min-width:640px){
    .horas-grid{grid-template-columns:repeat(8,1fr);}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="vista-login">
  <div class="login-card">
    <div class="login-strip"></div>
    <div class="login-body">
      <div class="login-brand"><span class="brand t2">T2</span><span class="brand sic">SIC</span></div>
      <p class="login-sub">SIC Digital VPO &mdash; inicio de turno</p>

      <div class="campo">
        <label for="in-turno">Turno</label>
        <select id="in-turno">
          <option value="" selected disabled>Selecciona un turno</option>
          <option value="Turno 1 - Ma&ntilde;ana">Turno 1 - Ma&ntilde;ana</option>
          <option value="Turno 2 - Tarde">Turno 2 - Tarde</option>
          <option value="Turno 3 - Nocturno">Turno 3 - Nocturno</option>
        </select>
      </div>
      <div class="campo">
        <label for="in-supervisor">Supervisor</label>
        <input id="in-supervisor" type="text" placeholder="Nombre y Apellido" autocomplete="off">
      </div>

      <button id="btn-login" type="button">Ingresar</button>
      <div class="login-error" id="login-error"></div>
    </div>
    <div class="login-footer">Creado por Borys Orellana</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="vista-app">
  <div class="topbar">
    <div class="brand"><span class="t2" style="color:var(--amber)">T2</span> SIC</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-reset" title="Reiniciar todo (nuevo reporte)">&#8635;</button>
      <button class="icon-btn" id="btn-logout" title="Salir">&#9211;</button>
    </div>
  </div>

  <main>

    <!-- Cabecera -->
    <section class="panel">
      <div class="marca-row">
        <span class="marca-ab">AB InBev</span>
        <span class="marca-sic">SIC <span class="accent">Digital</span> VPO</span>
      </div>
      <div class="grid2">
        <div class="campo-mini"><label>Subarea</label><input id="c-subarea"></div>
        <div class="campo-mini"><label>Fecha</label><input id="c-fecha" placeholder="dd/mm/aaaa"></div>
        <div class="campo-mini"><label>Area</label><input id="c-area"></div>
        <div class="campo-mini"><label>Gui&oacute;n</label><input id="c-guion" placeholder="Gui&oacute;n"></div>
        <div class="campo-mini full"><label>Monitoreo</label><input id="c-monitoreo"></div>
      </div>

      <div class="fila-transp">
        <div class="caja-transp">
          <label>TRANSPORTES PROGRAMADOS</label>
          <input id="c-transportes" class="num" inputmode="numeric" value="74">
        </div>
        <div class="caja-estatus" id="btn-estatus">
          <span class="led"></span>
          <span>ESTATUS DE CARGA</span>
        </div>
      </div>

      <!-- Mensaje de estatus (se muestra al tocar el led) -->
      <div id="panel-mensaje">
        <div class="mensaje-caja" id="mensaje-texto"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="btn-copiar-msg">Copiar</button>
          <button class="btn btn-amber" id="btn-whatsapp-msg">Enviar por WhatsApp</button>
        </div>
      </div>
    </section>

    <!-- Grafico -->
    <section class="panel">
      <div class="panel-title" id="titulo-grafico">Unidades cargadas x horas planificadas<span class="tag" id="tag-total">0/0</span></div>
      <div class="chart-wrap"><canvas id="grafico"></canvas></div>
      <div class="estado-fila">
        <span class="dot" id="estado-dot" style="background:var(--rojo)"></span>
        <span class="estado-txt" id="estado-txt">Sin datos a&uacute;n</span>
        <span class="estado-pct num" id="estado-pct">0%</span>
      </div>
    </section>

    <!-- Editar datos por hora -->
    <section class="panel">
      <div class="panel-title">Editar datos</div>
      <div class="horas-grid" id="horas-grid"></div>

      <div class="campo-dato">
        <label>Armados</label>
        <input id="d-armado" inputmode="numeric" value="0">
      </div>
      <div class="campo-dato">
        <label>Cargados</label>
        <input id="d-cargado" inputmode="numeric" value="0">
      </div>

      <button class="btn btn-amber" id="btn-actualizar" style="margin-top:6px;">Actualizar</button>
    </section>

    <!-- Planes de reaccion -->
    <section class="panel compact">
      <div class="panel-title small">Planes de reacci&oacute;n</div>
      <div id="planes-lista"></div>
    </section>

    <!-- Historico -->
    <section class="panel">
      <div class="collapsible-head" data-target="hist-body">
        <div class="panel-title" style="margin:0;">Hist&oacute;rico<span class="chev" id="chev-hist">&#9662;</span></div>
      </div>
      <div class="collapsible-body" id="hist-body">
        <div id="hist-lista"></div>
      </div>
    </section>

    <footer class="app-footer">T2 SIC &middot; Creado por Borys Orellana</footer>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============== CLAVES DE ALMACENAMIENTO ============== */
  var SESSION_KEY = "t2sic_session";
  var DATA_KEY = "t2sic_data";
  var HIST_KEY = "t2sic_historico";

  /* ============== ALMACENAMIENTO SEGURO ============== */
  var memoria = {}, memoriaSesion = {};
  function guardarValor(key, val){ try{ localStorage.setItem(key, val); }catch(e){ memoria[key] = val; } }
  function leerValor(key){ try{ return localStorage.getItem(key); }catch(e){ return (key in memoria) ? memoria[key] : null; } }
  function guardarSesion(key, val){ try{ sessionStorage.setItem(key, val); }catch(e){ memoriaSesion[key] = val; } }
  function leerSesion(key){ try{ return sessionStorage.getItem(key); }catch(e){ return (key in memoriaSesion) ? memoriaSesion[key] : null; } }
  function borrarSesion(key){ try{ sessionStorage.removeItem(key); }catch(e){} delete memoriaSesion[key]; }

  /* ============== ESTADO ============== */
  var estado = null;
  var horaSelIdx = 0;

  var TURNO_INICIO = {
    "Turno 1 - Ma\u00f1ana": 7,   // 7:00 am a 3:00 pm
    "Turno 2 - Tarde": 15,     // 3:00 pm a 11:00 pm
    "Turno 3 - Nocturno": 23   // 11:00 pm a 7:00 am
  };

  function horaLabel(h24){
    var h = ((h24 % 24) + 24) % 24;
    var periodo = h < 12 ? "am" : "pm";
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ":00 " + periodo;
  }

  function generarHorasPorTurno(turno){
    var inicio = (turno && TURNO_INICIO.hasOwnProperty(turno)) ? TURNO_INICIO[turno] : TURNO_INICIO["Turno 3 - Nocturno"];
    var horas = [];
    for(var i=0; i<8; i++){
      horas.push({ hora: horaLabel(inicio + i), armado:0, cargado:0 });
    }
    return horas;
  }

  function horasCoincidenConTurno(horas, turno){
    var esperadas = generarHorasPorTurno(turno);
    if(!horas || horas.length !== esperadas.length) return false;
    for(var i=0; i<esperadas.length; i++){
      if(horas[i].hora !== esperadas[i].hora) return false;
    }
    return true;
  }

  function datosPorDefecto(){
    return {
      turno:"", supervisor:"",
      subarea:"T2", fecha:"", area:"LOG", guion:"",
      monitoreo:"Unidades cargadas x horas planificadas",
      transportesProgramados:74,
      horas: generarHorasPorTurno("Turno 3 - Nocturno"),
      planes:[
        {n:1,accion:"Solicitar apoyo a T1 con operarios y FLT"},
        {n:2,accion:"Solicitar al CD amplitud de VH por salida tard\u00eda"},
        {n:3,accion:"Solicitar personal de carga de furgones para picking"},
        {n:4,accion:""},
        {n:5,accion:"Solicitar refuerzo con movilizador de otro turno"},
        {n:6,accion:"Mantener"},
        {n:7,accion:""},{n:8,accion:""},{n:9,accion:""},{n:10,accion:""}
      ]
    };
  }

  function fechaHoyStr(){
    var d = new Date();
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    return dd+"/"+mm+"/"+yy;
  }

  function cargarEstado(){
    try{
      var raw = leerValor(DATA_KEY);
      if(raw){ estado = JSON.parse(raw); }
      else { estado = datosPorDefecto(); estado.fecha = fechaHoyStr(); }
    }catch(e){ estado = datosPorDefecto(); estado.fecha = fechaHoyStr(); }
    if(!estado.fecha) estado.fecha = fechaHoyStr();
    if(!estado.horas || !estado.horas.length) estado.horas = datosPorDefecto().horas;
  }

  function guardarEstado(){ try{ guardarValor(DATA_KEY, JSON.stringify(estado)); }catch(e){} }
  function cargarHistorico(){ try{ var raw = leerValor(HIST_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
  function guardarHistorico(lista){ try{ guardarValor(HIST_KEY, JSON.stringify(lista)); }catch(e){} }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._tm);
    toast._tm = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function escapeAttr(s){
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }

  /* ============== LOGIN ============== */
  function intentarLogin(){
    var err = document.getElementById("login-error");
    try{
      var turno = document.getElementById("in-turno").value;
      var supervisor = document.getElementById("in-supervisor").value.trim();
      if(!turno){ err.textContent = "Selecciona un turno."; return; }
      if(!supervisor){ err.textContent = "Escribe el nombre del supervisor."; return; }
      err.textContent = "";
      cargarEstado();
      estado.turno = turno;
      estado.supervisor = supervisor;
      if(!horasCoincidenConTurno(estado.horas, turno)){
        estado.horas = generarHorasPorTurno(turno);
        horaSelIdx = 0;
      }
      guardarEstado();
      guardarSesion(SESSION_KEY, "1");
      mostrarApp();
    }catch(e){
      err.textContent = "No se pudo ingresar. Intenta recargar la p\u00e1gina.";
    }
  }

  function mostrarApp(){
    document.getElementById("vista-login").style.display = "none";
    document.getElementById("vista-app").style.display = "block";
    if(!estado) cargarEstado();
    render();
  }

  function cerrarSesion(){
    borrarSesion(SESSION_KEY);
    document.getElementById("vista-app").style.display = "none";
    document.getElementById("vista-login").style.display = "flex";
    document.getElementById("in-turno").value = "";
    document.getElementById("in-supervisor").value = "";
    document.getElementById("login-error").textContent = "";
  }

  document.getElementById("btn-login").addEventListener("click", intentarLogin);
  document.getElementById("btn-logout").addEventListener("click", cerrarSesion);

  document.getElementById("btn-reset").addEventListener("click", function(){
    var ok = confirm(
      "Esto va a reiniciar TODO el reporte actual a cero:\n\n" +
      "- Transportes programados\n" +
      "- Armados y Cargados de todas las horas\n" +
      "- La fecha (queda en la de hoy)\n\n" +
      "El hist\u00f3rico ya guardado NO se borra.\n\n" +
      "\u00bfSeguro que quieres continuar?"
    );
    if(!ok) return;

    var turnoActual = estado.turno;
    var supervisorActual = estado.supervisor;

    estado = datosPorDefecto();
    estado.turno = turnoActual;
    estado.supervisor = supervisorActual;
    estado.horas = generarHorasPorTurno(turnoActual);
    estado.fecha = fechaHoyStr();
    horaSelIdx = 0;

    guardarEstado();
    render();
    toast("Reporte reiniciado. Listo para un nuevo d\u00eda.");
  });

  /* ============== RENDER: CABECERA ============== */
  function bindCabecera(){
    document.getElementById("c-subarea").value = estado.subarea;
    document.getElementById("c-fecha").value = estado.fecha;
    document.getElementById("c-area").value = estado.area;
    document.getElementById("c-guion").value = estado.guion || "";
    document.getElementById("c-monitoreo").value = estado.monitoreo;
    document.getElementById("c-transportes").value = estado.transportesProgramados;
    document.getElementById("titulo-grafico").childNodes[0].nodeValue = estado.monitoreo;

    document.getElementById("c-subarea").oninput = function(){ estado.subarea = this.value; guardarEstado(); };
    document.getElementById("c-fecha").oninput = function(){ estado.fecha = this.value; guardarEstado(); };
    document.getElementById("c-area").oninput = function(){ estado.area = this.value; guardarEstado(); };
    document.getElementById("c-guion").oninput = function(){ estado.guion = this.value; guardarEstado(); };
    document.getElementById("c-monitoreo").oninput = function(){
      estado.monitoreo = this.value; guardarEstado();
      document.getElementById("titulo-grafico").childNodes[0].nodeValue = estado.monitoreo;
    };
    document.getElementById("c-transportes").oninput = function(){
      estado.transportesProgramados = Number(this.value)||0;
      guardarEstado();
      dibujarGrafico();
      actualizarMensaje();
    };
  }

  /* ============== ESTATUS DE CARGA (mensaje) ============== */
  function generarMensaje(){
    var h = estado.horas[horaSelIdx] || {};
    var pct = estado.transportesProgramados > 0 ? Math.round(((h.cargado||0)/estado.transportesProgramados)*100) : 0;
    return "STATUS DE CARGA\n" +
      "Turno: " + (estado.turno || "-") + "\n" +
      "Supervisor: " + (estado.supervisor || "-") + "\n" +
      "Area: Logistica T2\n" +
      "Guion: " + (estado.guion || "-") + "\n" +
      "Fecha: " + (estado.fecha || "-") + "\n" +
      "Hora: " + (h.hora || "-") + "\n" +
      "Armados: " + (h.armado||0) + "\n" +
      "Cargados: " + (h.cargado||0) + " / " + (estado.transportesProgramados||0) + "\n" +
      "Cumplimiento: " + pct + "%";
  }

  function actualizarMensaje(){
    document.getElementById("mensaje-texto").textContent = generarMensaje();
  }

  document.getElementById("btn-estatus").addEventListener("click", function(){
    var panel = document.getElementById("panel-mensaje");
    actualizarMensaje();
    panel.classList.toggle("open");
  });

  document.getElementById("btn-copiar-msg").addEventListener("click", function(){
    var texto = generarMensaje();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){ toast("Mensaje copiado"); })
        .catch(function(){ copiarFallback(texto); });
    } else {
      copiarFallback(texto);
    }
  });

  function copiarFallback(texto){
    try{
      var ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast("Mensaje copiado");
    }catch(e){ toast("No se pudo copiar"); }
  }

  document.getElementById("btn-whatsapp-msg").addEventListener("click", function(){
    var texto = generarMensaje();
    window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
  });

  /* ============== HORAS: SELECTOR + 2 CAMPOS ============== */
  function renderHorasGrid(){
    var cont = document.getElementById("horas-grid");
    cont.innerHTML = "";
    estado.horas.forEach(function(h, i){
      var tieneDatos = (h.armado||h.cargado) ? true : false;
      var btn = document.createElement("div");
      btn.className = "hora-btn" + (i === horaSelIdx ? " activa" : "");
      btn.innerHTML = escapeAttr(h.hora) + (tieneDatos ? '<span class="chk">&#10003;</span>' : '');
      btn.addEventListener("click", function(){
        horaSelIdx = i;
        renderHorasGrid();
        bindDatosHora();
        dibujarGrafico();
        actualizarMensaje();
      });
      cont.appendChild(btn);
    });
  }

  function bindDatosHora(){
    var h = estado.horas[horaSelIdx];
    document.getElementById("d-armado").value = h.armado || 0;
    document.getElementById("d-cargado").value = h.cargado || 0;
  }

  document.getElementById("d-armado").addEventListener("input", function(){
    estado.horas[horaSelIdx].armado = Number(this.value)||0; guardarEstado(); actualizarMensaje();
  });
  document.getElementById("d-cargado").addEventListener("input", function(){
    estado.horas[horaSelIdx].cargado = Number(this.value)||0; guardarEstado(); dibujarGrafico(); actualizarMensaje();
  });

  /* ============== PLANES ============== */
  function renderPlanes(){
    var cont = document.getElementById("planes-lista");
    cont.innerHTML = "";
    estado.planes.forEach(function(p, i){
      var row = document.createElement("div");
      row.className = "plan-row";
      row.innerHTML = '<div class="plan-num">'+p.n+'</div><input data-i="'+i+'" placeholder="Acci\u00f3n..." value="'+escapeAttr(p.accion)+'">';
      cont.appendChild(row);
    });
    cont.querySelectorAll("input").forEach(function(inp){
      inp.addEventListener("input", function(){
        estado.planes[Number(this.dataset.i)].accion = this.value;
        guardarEstado();
      });
    });
  }

  /* ============== CALCULO + GRAFICO (canvas nativo, sin librerias externas) ============== */
  function calcularPorcentajes(){
    var meta = estado.transportesProgramados || 0;
    estado.horas.forEach(function(h){
      h.pct = meta > 0 ? (h.cargado||0) / meta : 0;
    });
    return meta;
  }

  function dibujarGrafico(){
    var meta = calcularPorcentajes();
    var horas = estado.horas;
    var canvas = document.getElementById("grafico");
    var wrap = canvas.parentElement;
    if(!wrap || !horas.length) return;

    var dpr = window.devicePixelRatio || 1;
    var cssW = wrap.clientWidth || 300;
    var cssH = wrap.clientHeight || 220;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";

    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    var padL = 32, padR = 18, padT = 8, padB = 40;
    var chartW = Math.max(10, cssW - padL - padR);
    var chartH = Math.max(10, cssH - padT - padB);
    var n = horas.length;

    function xPos(i){ return padL + (n <= 1 ? chartW/2 : (i/(n-1)) * chartW); }
    function yPos(frac){ var maxVal = 1.05; return padT + chartH - (Math.max(0,Math.min(frac,maxVal))/maxVal) * chartH; }

    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.fillStyle = "#8d99a3";
    ctx.font = "9px Inter, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.lineWidth = 1;
    [0, 0.25, 0.5, 0.75, 1].forEach(function(f){
      var y = yPos(f);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + chartW, y); ctx.stroke();
      ctx.fillText(Math.round(f*100) + "%", padL - 6, y);
    });

    /* La zona roja/verde ahora es una ESCALERA calculada directamente del
       dato real (pct) de cada hora: el limite entre rojo y verde para el
       tramo [hora i, hora i+1) es el propio valor de esa hora. Como el
       punto de esa hora vale exactamente eso, el punto siempre queda
       justo en el borde o por encima -> nunca cae en zona roja. */
    var pctPts = horas.map(function(h,i){ return {x:xPos(i), y:yPos(h.pct||0)}; });

    for(var s=0; s<n; s++){
      var xa = xPos(s);
      var xb = (s < n-1) ? xPos(s+1) : (padL + chartW);
      var yLimite = yPos(horas[s].pct||0);
      var yTop = yPos(1);
      var yBase = yPos(0);
      // bloque rojo (0 .. pct de esta hora)
      ctx.fillStyle = "rgba(229,72,77,0.85)";
      ctx.fillRect(xa, yLimite, xb-xa, yBase-yLimite);
      // bloque verde (pct .. 100%)
      ctx.fillStyle = "rgba(51,214,137,0.85)";
      ctx.fillRect(xa, yTop, xb-xa, yLimite-yTop);
    }

    if(pctPts.length){
      ctx.beginPath();
      pctPts.forEach(function(p,i){ i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); });
      ctx.strokeStyle = "#eef1f3";
      ctx.lineWidth = 2.5;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.stroke();

      pctPts.forEach(function(p,i){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2);
        ctx.fillStyle = "#eef1f3";
        ctx.fill();
        var label = Math.round((horas[i].pct||0)*100) + "%";
        ctx.font = "600 10px 'Roboto Mono', monospace";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.fillText(label, p.x, p.y - 7);
      });
    }

    // Etiquetas de hora en el eje X, en HORIZONTAL, bien espaciadas.
    ctx.fillStyle = "#8d99a3";
    ctx.font = "9px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    horas.forEach(function(h,i){
      var x = xPos(i);
      var y = padT + chartH + 10;
      ctx.fillText(h.hora, x, y);
    });

    var actual = horas[horaSelIdx] || horas[horas.length-1] || {pct:0, cargado:0};
    var pctUlt = Math.round((actual.pct||0)*100);
    var dot = document.getElementById("estado-dot");
    var txt = document.getElementById("estado-txt");
    var pctEl = document.getElementById("estado-pct");
    var color, mensaje;
    if(pctUlt >= 90){ color="var(--verde)"; mensaje="En verde, dentro de meta"; }
    else if(pctUlt >= 50){ color="var(--amber)"; mensaje="En rango de alerta"; }
    else { color="var(--rojo)"; mensaje="En rojo, requiere plan de reacci\u00f3n"; }
    dot.style.background = color;
    txt.textContent = mensaje;
    pctEl.textContent = pctUlt + "%";
    pctEl.style.color = color;

    document.getElementById("tag-total").textContent = (actual.cargado||0)+"/"+(estado.transportesProgramados||0);
  }

  var _resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function(){
      if(estado && document.getElementById("vista-app").style.display !== "none"){ dibujarGrafico(); }
    }, 150);
  });

  /* ============== ACTUALIZAR ============== */
  document.getElementById("btn-actualizar").addEventListener("click", function(){
    guardarEstado();
    dibujarGrafico();
    renderHorasGrid();
    guardarEnHistorico();
    actualizarMensaje();
    toast("Hora " + estado.horas[horaSelIdx].hora + " actualizada");
  });

  /* ============== HISTORICO (tipo base de datos) ============== */
  function guardarEnHistorico(){
    var lista = cargarHistorico();
    var h = estado.horas[horaSelIdx];
    var pct = estado.transportesProgramados > 0 ? (h.cargado||0)/estado.transportesProgramados : 0;

    var registro = {
      ts: Date.now(),
      fecha: estado.fecha,
      hora: h.hora,
      turno: estado.turno,
      supervisor: estado.supervisor,
      subarea: estado.subarea,
      area: estado.area,
      guion: estado.guion,
      transportesProgramados: estado.transportesProgramados,
      armado: h.armado||0,
      cargado: h.cargado||0,
      pct: pct
    };

    var idx = lista.findIndex(function(r){
      return String(r.fecha).trim() === String(estado.fecha).trim() && String(r.hora).trim() === String(h.hora).trim();
    });
    if(idx >= 0) lista[idx] = registro; else lista.push(registro);

    lista.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    guardarHistorico(lista);
    renderHistorico();
  }

  function renderHistorico(){
    var cont = document.getElementById("hist-lista");
    var lista = cargarHistorico();
    cont.innerHTML = "";
    if(!lista.length){
      cont.innerHTML = '<div class="hist-empty">A&uacute;n no hay registros guardados.</div>';
      return;
    }
    lista.slice(0, 60).forEach(function(r){
      var pct = Math.round((r.pct||0)*100);
      var color = pct>=90 ? "var(--verde)" : (pct>=50 ? "var(--amber)" : "var(--rojo)");
      var item = document.createElement("div");
      item.className = "hist-item";
      item.innerHTML =
        '<span class="hist-fecha">'+escapeAttr(r.fecha||"-")+'<br>'+escapeAttr(r.hora||"-")+'</span>'+
        '<span class="hist-info">'+escapeAttr(r.turno||"")+' &middot; '+escapeAttr(r.supervisor||"")+' &middot; '+(r.cargado||0)+'/'+(r.transportesProgramados||0)+'</span>'+
        '<span class="hist-pct" style="color:'+color+'">'+pct+'%</span>';
      item.addEventListener("click", function(){
        if(confirm("Cargar los datos de "+r.fecha+" "+r.hora+" al editor?")){
          var idx = estado.horas.findIndex(function(h){ return h.hora === r.hora; });
          if(idx >= 0){
            estado.horas[idx].armado = r.armado;
            estado.horas[idx].cargado = r.cargado;
            horaSelIdx = idx;
            guardarEstado();
            render();
            toast("Datos de "+r.hora+" cargados");
          }
        }
      });
      cont.appendChild(item);
    });
  }

  /* ============== COLAPSABLES ============== */
  document.querySelectorAll(".collapsible-head").forEach(function(head){
    head.addEventListener("click", function(){
      var body = document.getElementById(head.dataset.target);
      var chev = head.querySelector(".chev");
      body.classList.toggle("open");
      if(chev) chev.classList.toggle("open");
    });
  });

  /* ============== RENDER GENERAL ============== */
  function render(){
    bindCabecera();
    renderHorasGrid();
    bindDatosHora();
    renderPlanes();
    dibujarGrafico();
    renderHistorico();
    actualizarMensaje();
  }

  /* ============== INICIO ============== */
  window.addEventListener("DOMContentLoaded", function(){
    if(leerSesion(SESSION_KEY) === "1"){
      cargarEstado();
      mostrarApp();
    }
  });

})();
</script>
